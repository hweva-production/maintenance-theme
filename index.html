<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- SEO Meta Tags -->
    <title>Website Under Maintenance | We'll Be Back Soon</title>
    <meta name="description" content="Our website is currently under maintenance. We're making improvements and will be back soon. Subscribe to get notified when we're live!">
    <meta name="keywords" content="website maintenance, under construction, coming soon">
    <meta name="author" content="Webspace">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Website Under Maintenance | We'll Be Back Soon">
    <meta property="og:description" content="Our website is currently under maintenance. We're making improvements and will be back soon.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourwebsite.com">
    <meta property="og:image" content="./assets/og-image.jpg">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Website Under Maintenance | We'll Be Back Soon">
    <meta name="twitter:description" content="Our website is currently under maintenance. We're making improvements and will be back soon.">
    <meta name="twitter:image" content="./assets/og-image.jpg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="alternate icon" href="./assets/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Website Under Maintenance",
        "description": "Our website is currently under maintenance. We're making improvements and will be back soon.",
        "url": "https://yourwebsite.com",
        "potentialAction": {
            "@type": "NotifyAction",
            "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://yourwebsite.com"
            },
            "result": {
                "@type": "NotifyAction",
                "name": "Get notified when website is live"
            }
        }
    }
    </script>
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Skip Link for Accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Preloader -->
    <div id="preloader" class="preloader">
        <div class="preloader-spinner">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path class="sun-icon" d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"></path>
                    <path class="sun-icon" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    <path class="moon-icon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="main">
            <!-- Hero Section -->
            <section class="hero">
                <!-- Animated SVG Illustration -->
                <div class="illustration-wrapper">
                    <svg class="maintenance-illustration" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" aria-label="Maintenance illustration">
                        <!-- Subtle background circle -->
                        <circle class="illustration-bg" cx="200" cy="150" r="90" fill="none" stroke="currentColor" stroke-width="2" opacity="0.2"/>
                        
                        <!-- Server/Computer Tower -->
                        <g class="server-tower" transform="translate(200, 150)">
                            <!-- Server chassis -->
                            <rect x="-40" y="-50" width="80" height="100" rx="4" fill="none" stroke="currentColor" stroke-width="4"/>
                            
                            <!-- Server rack slots (3 horizontal lines) -->
                            <line x1="-35" y1="-30" x2="35" y2="-30" stroke="currentColor" stroke-width="2" opacity="0.6"/>
                            <line x1="-35" y1="0" x2="35" y2="0" stroke="currentColor" stroke-width="2" opacity="0.6"/>
                            <line x1="-35" y1="30" x2="35" y2="30" stroke="currentColor" stroke-width="2" opacity="0.6"/>
                            
                            <!-- LED indicators -->
                            <circle cx="-30" cy="-30" r="2" fill="currentColor" opacity="0.8"/>
                            <circle cx="-30" cy="0" r="2" fill="currentColor" opacity="0.8"/>
                            <circle cx="-30" cy="30" r="2" fill="currentColor" opacity="0.8"/>
                            
                            <!-- Power button -->
                            <circle cx="30" cy="40" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
                            <circle cx="30" cy="40" r="2" fill="currentColor" opacity="0.7"/>
                        </g>
                    </svg>
                </div>

                <!-- Headline -->
                <h1 class="headline fade-in-up">We're Under Maintenance</h1>
                
                <!-- Sub-text -->
                <p class="subtext fade-in-up">Our website is getting a quick tune-up. We'll be back soon!</p>

                <!-- Countdown Timer -->
                <div class="countdown-container fade-in-up">
                    <div class="countdown-timer">
                        <div class="countdown-item">
                            <span class="countdown-number" id="days">00</span>
                            <span class="countdown-label">Days</span>
                        </div>
                        <div class="countdown-separator">:</div>
                        <div class="countdown-item">
                            <span class="countdown-number" id="hours">00</span>
                            <span class="countdown-label">Hours</span>
                        </div>
                        <div class="countdown-separator">:</div>
                        <div class="countdown-item">
                            <span class="countdown-number" id="minutes">00</span>
                            <span class="countdown-label">Minutes</span>
                        </div>
                        <div class="countdown-separator">:</div>
                        <div class="countdown-item">
                            <span class="countdown-number" id="seconds">00</span>
                            <span class="countdown-label">Seconds</span>
                        </div>
                    </div>
                </div>

                <!-- Notify Me Form -->
                <div class="form-container fade-in-up">
                    <form id="notify-form" class="notify-form" novalidate>
                        <div class="form-group">
                            <input 
                                type="email" 
                                id="email-input" 
                                name="email" 
                                class="email-input" 
                                placeholder="Enter your email address" 
                                required
                                aria-label="Email address"
                                aria-describedby="email-error"
                            >
                            <button type="submit" class="submit-btn" aria-label="Submit email for notification">
                                Notify Me
                            </button>
                        </div>
                        <div id="email-error" class="error-message" role="alert" aria-live="polite"></div>
                        <div id="form-success" class="success-message" role="alert" aria-live="polite"></div>
                    </form>
                </div>

                <!-- Social Media Icons -->
                <div class="social-container fade-in-up">
                    <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Visit our Facebook page">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                    </a>
                    <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Visit our X (Twitter) page">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                        </svg>
                    </a>
                    <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Visit our LinkedIn page">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                        </svg>
                    </a>
                    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Visit our Instagram page">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                        </svg>
                    </a>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p class="footer-text footer-design">
                Design by <a href="https://webspace.ng" target="_blank" rel="noopener noreferrer" class="footer-link">Webspace</a>
            </p>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="./js/main.js"></script>
</body>
</html>
